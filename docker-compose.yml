version: '3.8'

services:
  traefik:
    image: traefik:v3.6.7
    restart: always
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=dokploy-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@endscams.org}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - dokploy-network

  endscams:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://rnrqvdwtbehilaoyzfgf.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJucnF2ZHd0YmVoaWxhb3l6ZmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0OTk3MDcsImV4cCI6MjA4OTA3NTcwN30.UMn_5tcDhBcdalUg_Z-b_y0M-BmRxhoHvv-GrhAYvwQ}
    restart: always
    expose:
      - "80"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.endscams.rule=Host(`endscams.org`) || Host(`www.endscams.org`)"
      - "traefik.http.routers.endscams.entrypoints=websecure"
      - "traefik.http.routers.endscams.tls.certResolver=letsencrypt"
      - "traefik.http.services.endscams.loadbalancer.server.port=80"

volumes:
  letsencrypt:

networks:
  dokploy-network:
    external: true
